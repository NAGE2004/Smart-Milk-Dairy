<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('payments');
$('#app').innerHTML = `<div class="row g-3 mb-4">
<div class="col-md-5"><div class="card p-3 h-100"><h6>Automatic 10-day cycle</h6><p class="small text-muted mb-2" id="cyc"></p>
<div><button class="btn btn-leaf" id="auto">Generate last completed cycle</button></div></div></div>
<div class="col-md-7"><div class="card p-3 h-100"><h6>Or choose any period</h6><form id="f" class="row g-2">
<div class="col-md-4"><input class="form-control" type="date" name="start" required></div>
<div class="col-md-4"><input class="form-control" type="date" name="end" id="end" required></div>
<div class="col-md-4"><button class="btn btn-outline-secondary w-100">Generate</button></div></form></div></div></div>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Farmer</th><th>Period</th><th>Litres</th><th>Gross</th><th>Deductions</th><th>Net</th><th>Status</th><th>Pay</th></tr></thead><tbody id="tbl"></tbody></table></div></div>`;
async function load() {
  const d = await api('/payments');
  $('#cyc').innerHTML = `Cycles are 1–10, 11–20 and 21–month end. Last completed cycle: <b>${d.cycle.start} → ${d.cycle.end}</b>. Each farmer gets a statement message.`;
  if (!$('#end').value) $('#end').value = d.today;
  $('#tbl').innerHTML = d.rows.map((r) => `<tr><td>${esc(r.name)}<br><small class="text-muted">${esc(r.bank_account)}</small></td>
<td>${r.period_start} → ${r.period_end}</td><td>${n2(r.total_litres)}</td><td>${money(r.gross_amount)}</td>
<td>${r.status === 'pending' ? `<form class="ded d-flex gap-1" data-id="${r.payment_id}"><input class="form-control form-control-sm" style="width:90px" type="number" step="0.01" min="0" name="deductions" value="${r.deductions}"><button class="btn btn-sm btn-outline-secondary">Set</button></form>` : money(r.deductions)}</td>
<td><b>${money(r.net_amount)}</b></td>
<td><span class="badge bg-${r.status === 'paid' ? 'success' : 'warning text-dark'}">${r.status}</span></td>
<td>${r.status === 'pending' ? `<form class="pay d-flex gap-1" data-id="${r.payment_id}"><select class="form-select form-select-sm" style="width:80px" name="mode"><option>cash</option><option>bank</option><option>upi</option></select>
<input class="form-control form-control-sm" style="width:110px" name="reference" placeholder="Ref / UTR"><button class="btn btn-sm btn-leaf">Paid</button></form>` : r.paid_on}</td></tr>`).join('')
    || '<tr><td colspan="8" class="text-muted">No payment records yet. Generate a cycle above.</td></tr>';
}
const made = (r) => flash(`${r.start} to ${r.end}: ${r.made} payment record(s) generated and statements sent.`);
$('#auto').onclick = act(async () => { made(await api('/payments/generate', 'POST', {})); load(); });
$('#f').addEventListener('submit', act(async (e) => { e.preventDefault(); made(await api('/payments/generate', 'POST', formData(e.target))); load(); }));
$('#tbl').addEventListener('submit', act(async (e) => {
  e.preventDefault(); const f = e.target, id = f.dataset.id;
  if (f.classList.contains('ded')) { await api(`/payments/${id}/deduct`, 'POST', formData(f)); flash('Deduction saved.'); }
  else { const r = await api(`/payments/${id}/pay`, 'POST', formData(f)); flash(`Payment recorded. Message: ${r.message}.`); }
  load();
}));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
