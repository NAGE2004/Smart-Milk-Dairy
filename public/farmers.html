<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
const me = await boot('farmers');
const admin = me.role === 'admin';
$('#app').innerHTML = `<div class="card p-3 mb-4"><h6>Register farmer</h6>
<form id="add" class="row g-2">
<div class="col-md-3"><input class="form-control" name="name" placeholder="Name" required></div>
<div class="col-md-2"><input class="form-control" name="phone" placeholder="Phone"></div>
<div class="col-md-2"><input class="form-control" name="village" placeholder="Village"></div>
<div class="col-md-2"><input class="form-control" name="bank_account" placeholder="Bank A/c"></div>
<div class="col-md-2"><select class="form-select" name="cattle_type"><option>cow</option><option>buffalo</option><option>mixed</option></select></div>
<div class="col-md-1"><button class="btn btn-leaf w-100">Add</button></div></form></div>
<div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Cattle</th><th>Status</th><th>Farmer login</th><th></th></tr></thead><tbody id="tbl"></tbody></table></div></div>`;
async function load() {
  const rows = await api('/farmers');
  $('#tbl').innerHTML = rows.map((r) => `<tr><td>${r.farmer_id}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.village)}</td><td>${esc(r.cattle_type)}</td>
<td>${r.active ? 'Active' : 'Inactive'}</td><td>${admin ? `<form class="lf d-flex gap-1" data-id="${r.farmer_id}">
<input class="form-control form-control-sm" style="width:110px" name="username" placeholder="username" value="${esc(r.username || '')}" required>
<input class="form-control form-control-sm" style="width:110px" type="password" name="password" placeholder="password" required>
<button class="btn btn-sm btn-leaf">${r.username ? 'Reset' : 'Create'}</button></form>` : esc(r.username || '—')}</td>
<td>${admin ? `<button class="btn btn-sm btn-outline-secondary" data-toggle="${r.farmer_id}">Toggle</button>` : ''}</td></tr>`).join('')
    || '<tr><td colspan="8" class="text-muted">No farmers yet.</td></tr>';
}
$('#add').addEventListener('submit', act(async (e) => {
  e.preventDefault(); await api('/farmers', 'POST', formData(e.target)); e.target.reset(); flash('Farmer added.'); load();
}));
$('#tbl').addEventListener('submit', act(async (e) => {
  e.preventDefault(); const f = e.target;
  const r = await api(`/farmers/${f.dataset.id}/login`, 'POST', formData(f)); flash(r.message); load();
}));
$('#tbl').addEventListener('click', act(async (e) => {
  const id = e.target.dataset.toggle; if (!id) return;
  await api(`/farmers/${id}/toggle`, 'POST'); load();
}));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
