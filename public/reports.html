<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('reports');
$('#app').innerHTML = `<div class="card p-3 mb-4"><h6>Farmer statement</h6><form id="f" class="row g-2">
<div class="col-md-4"><select class="form-select" name="farmer_id" id="farmer" required></select></div>
<div class="col-md-3"><input class="form-control" type="date" name="start"></div>
<div class="col-md-3"><input class="form-control" type="date" name="end"></div>
<div class="col-md-2"><button class="btn btn-leaf w-100">Show</button></div></form><div id="stmt"></div></div>
<div class="card p-3"><h6>Daily collection summary</h6><table class="table mb-0"><thead><tr><th>Date</th><th>Shift</th><th>Farmers</th><th>Litres</th><th>Amount</th></tr></thead><tbody id="daily"></tbody></table></div>`;
async function load() {
  const f = $('#f'), q = new URLSearchParams({ farmer_id: f.elements.farmer_id.value, start: f.elements.start.value, end: f.elements.end.value });
  const d = await api('/reports' + (f.elements.start.value ? '?' + q : ''));
  if (!f.elements.farmer_id.options.length)
    f.elements.farmer_id.innerHTML = '<option value="">Select farmer</option>' + d.farmers.map((x) => `<option value="${x.farmer_id}">${esc(x.name)}</option>`).join('');
  f.elements.start.value = d.start; f.elements.end.value = d.end; f.elements.farmer_id.value = d.fid;
  $('#stmt').innerHTML = d.totals ? `<div class="table-responsive"><table class="table mt-3 mb-1"><thead><tr><th>Date</th><th>Shift</th><th>Litres</th><th>Fat</th><th>SNF</th><th>Rate</th><th>Amount</th></tr></thead><tbody>
${d.stmt.map((r) => `<tr><td>${r.collection_date}</td><td>${r.shift}</td><td>${n2(r.quantity_litres)}</td><td>${n1(r.fat)}</td><td>${n1(r.snf)}</td><td>${n2(r.rate_per_litre)}</td><td>${money(r.amount)}</td></tr>`).join('')}
<tr class="fw-bold"><td colspan="2">Total</td><td>${n2(d.totals.litres)} L</td><td colspan="3"></td><td>${money(d.totals.amount)}</td></tr></tbody></table></div>` : '';
  $('#daily').innerHTML = d.daily.map((r) => `<tr><td>${r.collection_date}</td><td>${r.shift}</td><td>${r.farmers}</td><td>${n2(r.litres)}</td><td>${money(r.amount)}</td></tr>`).join('');
}
$('#f').addEventListener('submit', act(async (e) => { e.preventDefault(); load(); }));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
