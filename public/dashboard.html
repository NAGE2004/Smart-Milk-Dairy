<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Milk Dairy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  await boot('dashboard.html');
  const d = await api('/dashboard');

  const stat = (label, val, type, icon) => `
    <div class="col-md-3 col-6">
      <div class="stat-card ${type} border-${type === 'milk' ? 'green' : type === 'amount' ? 'yellow' : type === 'entries' ? 'blue' : 'purple'}">
        <div class="stat-label">${label}</div>
        <div class="stat-value">${val}</div>
        <div class="stat-icon">${icon}</div>
      </div>
    </div>`;

  $('#app').innerHTML = `
  <div class="page-header">
    <h4>Welcome back! 👋</h4>
    <p>Here's what's happening with your dairy today</p>
  </div>

  <div class="row g-3 mb-4">
    ${stat('Milk Collected', n2(d.today.litres) + ' L', 'milk', '🥛')}
    ${stat('Amount Payable', money(d.today.amount), 'amount', '💰')}
    ${stat('Entries Today', d.today.entries, 'entries', '📝')}
    ${stat('Active Farmers', d.farmers, 'farmers', '👨‍🌾')}
  </div>

  <div class="row g-3">
    <div class="col-lg-8">
      <div class="chart-card">
        <h6>Last 7 Days — Milk Collection (Litres)</h6>
        <canvas id="c" height="120"></canvas>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="stat-card pending border-red mb-3">
        <div class="stat-label">Pending Payments</div>
        <div class="stat-value">${money(d.pending)}</div>
        <div class="stat-icon">⏳</div>
      </div>
      <a href="alerts.html" class="text-decoration-none">
        <div class="stat-card alerts ${d.openAlerts ? 'border-red' : 'border-green'}">
          <div class="stat-label">Open Smart Alerts</div>
          <div class="stat-value">${d.openAlerts}</div>
          <div class="stat-icon">🔔</div>
        </div>
      </a>
    </div>
  </div>`;

  new Chart($('#c'), {
    type: 'bar',
    data: {
      labels: d.labels,
      datasets: [{
        label: 'Litres',
        data: d.values,
        backgroundColor: 'rgba(34, 197, 94, 0.8)',
        borderColor: '#16a34a',
        borderWidth: 0,
        borderRadius: 8,
        borderSkipped: false,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
      },
      responsive: true,
      maintainAspectRatio: true
    }
  });
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body>
</html>
