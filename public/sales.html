<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('sales');
$('#app').innerHTML = `<div class="row g-3"><div class="col-md-6">
<div class="card p-3"><h6>Record sale</h6><form id="f" class="row g-2">
<div class="col-12"><select class="form-select" name="product_id" id="prod"></select></div>
<div class="col-6"><input class="form-control" name="customer" placeholder="Customer name"></div>
<div class="col-4"><input class="form-control" type="number" step="0.01" name="quantity" placeholder="Qty" required></div>
<div class="col-2"><button class="btn btn-leaf w-100">Sell</button></div></form></div>
<div class="card p-3 mt-3"><h6>Stock</h6><table class="table table-sm mb-0"><tbody id="stock"></tbody></table></div></div>
<div class="col-md-6"><div class="card p-3"><h6>Recent sales</h6><table class="table mb-0"><thead><tr><th>Date</th><th>Item</th><th>Customer</th><th>Qty</th><th>Total</th></tr></thead><tbody id="tbl"></tbody></table></div></div></div>`;
async function load() {
  const d = await api('/sales');
  $('#prod').innerHTML = d.products.map((p) => `<option value="${p.product_id}">${esc(p.name)} — ₹${p.price}/${esc(p.unit)} (stock ${p.stock_qty})</option>`).join('');
  $('#stock').innerHTML = d.products.map((p) => `<tr><td>${esc(p.name)}</td><td>${p.stock_qty} ${esc(p.unit)}</td><td><form class="add d-flex gap-1" data-id="${p.product_id}">
<input class="form-control form-control-sm" style="width:80px" type="number" step="0.01" name="qty" placeholder="+qty" required><button class="btn btn-sm btn-outline-secondary">Add</button></form></td></tr>`).join('');
  $('#tbl').innerHTML = d.rows.map((r) => `<tr><td>${r.sale_date.slice(5, 16)}</td><td>${esc(r.name)}</td><td>${esc(r.customer_name)}</td><td>${r.quantity} ${esc(r.unit)}</td><td>${money(r.total_price)}</td></tr>`).join('');
}
$('#f').addEventListener('submit', act(async (e) => { e.preventDefault(); await api('/sales', 'POST', formData(e.target)); flash('Sale recorded.'); e.target.elements.quantity.value = ''; load(); }));
$('#stock').addEventListener('submit', act(async (e) => { e.preventDefault(); await api(`/products/${e.target.dataset.id}/stock`, 'POST', formData(e.target)); flash('Stock added.'); load(); }));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
