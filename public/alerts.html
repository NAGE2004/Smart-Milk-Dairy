<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('alerts');
let all = false;
$('#app').innerHTML = `<div class="card p-3"><div class="d-flex justify-content-between mb-2"><h6>Smart alerts</h6><a class="small" href="#" id="tog"></a></div>
<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Raised</th><th>Farmer</th><th>Entry</th><th>Alert</th><th></th></tr></thead><tbody id="tbl"></tbody></table></div></div>`;
async function load() {
  const rows = await api('/alerts?all=' + (all ? 1 : 0));
  $('#tog').textContent = all ? 'Show open only' : 'Show resolved too';
  $('#tbl').innerHTML = rows.map((r) => `<tr class="${r.resolved ? 'text-muted' : ''}"><td class="text-nowrap">${r.created_at.slice(5, 16)}</td><td>${esc(r.name)}</td>
<td class="small">${r.collection_date} ${r.shift}<br>${n2(r.quantity_litres)} L · Fat ${n1(r.fat)} · SNF ${n1(r.snf)}</td>
<td><span class="badge bg-${['low_snf', 'low_fat'].includes(r.kind) ? 'danger' : 'warning text-dark'}">${r.kind.replace('_', ' ')}</span><br><span class="small">${esc(r.detail)}</span>
${r.kind === 'yield_drop' ? '<br><span class="small text-success">Tips to increase milk were sent to the farmer.</span>' : ''}</td>
<td>${r.resolved ? 'resolved' : `<button class="btn btn-sm btn-outline-secondary" data-id="${r.alert_id}">Resolve</button>`}</td></tr>`).join('')
    || '<tr><td colspan="5" class="text-muted">No alerts. Everything looks normal.</td></tr>';
}
$('#tog').onclick = (e) => { e.preventDefault(); all = !all; load(); };
$('#tbl').addEventListener('click', act(async (e) => { const id = e.target.dataset.id; if (!id) return; await api(`/alerts/${id}/resolve`, 'POST'); load(); }));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
