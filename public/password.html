<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('password.html');
$('#app').innerHTML = `<div class="card p-4" style="max-width:420px"><h5 class="mb-3">Change password</h5><form id="f">
<input class="form-control mb-2" type="password" name="current" placeholder="Current password" required>
<input class="form-control mb-2" type="password" name="newPassword" placeholder="New password (min 6)" required>
<input class="form-control mb-3" type="password" name="confirm" placeholder="Confirm new password" required>
<button class="btn btn-leaf">Update</button></form></div>`;
$('#f').addEventListener('submit', act(async (e) => {
  e.preventDefault(); await api('/password', 'POST', formData(e.target)); e.target.reset(); flash('Password changed.');
}));
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
