<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('collect');
$('#app').innerHTML = `<div class="card p-3 mb-4"><h6>New milk collection entry</h6><form id="f" class="row g-2">
<div class="col-md-4"><select class="form-select" name="farmer_id" id="farmer" required></select></div>
<div class="col-md-2"><select class="form-select" name="center_id" id="center"></select></div>
<div class="col-md-2"><input class="form-control" type="date" name="date" id="date" required></div>
<div class="col-md-2"><select class="form-select" name="shift"><option>morning</option><option>evening</option></select></div>
<div class="col-md-2"><select class="form-select" name="milk_type"><option>cow</option><option>buffalo</option></select></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="qty" placeholder="Litres" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.1" name="fat" placeholder="Fat %" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.1" name="snf" placeholder="SNF %" required></div>
<div class="col-md-3"><button class="btn btn-leaf w-100">Save entry</button></div></form></div>
<div class="card p-3"><h6>Today's entries</h6><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Farmer</th><th>Shift</th><th>Type</th><th>Litres</th><th>Fat</th><th>SNF</th><th>Rate</th><th>Amount</th></tr></thead><tbody id="tbl"></tbody></table></div></div>`;
async function load(first) {
  const m = await api('/collect/meta');
  if (first) {
    $('#farmer').innerHTML = m.farmers.map((f) => `<option value="${f.farmer_id}">${f.farmer_id} - ${esc(f.name)} (${esc(f.village)})</option>`).join('');
    $('#center').innerHTML = m.centers.map((c) => `<option value="${c.center_id}">${esc(c.name)}</option>`).join('');
    $('#date').value = m.today;
  }
  $('#tbl').innerHTML = m.recent.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.shift}</td><td>${r.milk_type}</td><td>${n2(r.quantity_litres)}</td><td>${n1(r.fat)}</td><td>${n1(r.snf)}</td><td>${n2(r.rate_per_litre)}</td><td>${money(r.amount)}</td></tr>`).join('')
    || '<tr><td colspan="8" class="text-muted">No entries yet today.</td></tr>';
}
$('#f').addEventListener('submit', act(async (e) => {
  e.preventDefault();
  const r = await api('/collections', 'POST', formData(e.target));
  if (r.alerts && r.alerts.length) flash('Smart alert: ' + r.alerts.join('; '), 'warning');
  if (r.warning) flash(r.warning, 'warning');
  else flash(`Saved. Rate Rs ${r.rate}/L, Amount Rs ${r.amount}. Message: ${r.message}.`);
  ['qty', 'fat', 'snf'].forEach((n) => (e.target.elements[n].value = ''));
  load();
}));
load(true);
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
