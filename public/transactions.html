<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Milk Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
await boot('transactions');
$('#app').innerHTML = `<div class="card p-3 mb-4"><h6>Payment transactions</h6><form id="f" class="row g-2">
<div class="col-md-3"><input class="form-control" type="date" name="start"></div>
<div class="col-md-3"><input class="form-control" type="date" name="end"></div>
<div class="col-md-2"><button class="btn btn-leaf w-100">Show</button></div></form></div>
<div class="row g-3 mb-4" id="stats"></div>
<div class="row g-3"><div class="col-md-4"><div class="card p-3"><h6>Day-wise totals</h6><table class="table table-sm mb-0"><thead><tr><th>Date</th><th>Payments</th><th>Amount</th></tr></thead><tbody id="days"></tbody></table></div></div>
<div class="col-md-8"><div class="card p-3"><h6>All transactions</h6><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>#</th><th>Date</th><th>Farmer</th><th>Amount</th><th>Mode</th><th>Reference</th></tr></thead><tbody id="tbl"></tbody></table></div></div></div></div>`;
async function load() {
  const f = $('#f'), q = new URLSearchParams({ start: f.elements.start.value, end: f.elements.end.value });
  const d = await api('/transactions' + (f.elements.start.value ? '?' + q : ''));
  f.elements.start.value = d.start; f.elements.end.value = d.end;
  const stat = (l, v) => `<div class="col-md-3"><div class="card stat p-3"><small>${l}</small><h3>${money(v)}</h3></div></div>`;
  $('#stats').innerHTML = stat('Total paid', d.grand) + d.byMode.map((m) => stat(m.mode.toUpperCase(), m.total)).join('');
  $('#days').innerHTML = d.byDay.map((x) => `<tr><td>${x.txn_date}</td><td>${x.n}</td><td>${money(x.total)}</td></tr>`).join('') || '<tr><td colspan="3" class="text-muted">None</td></tr>';
  $('#tbl').innerHTML = d.rows.map((t) => `<tr><td>${t.txn_id}</td><td>${t.txn_date}</td><td>${esc(t.name)}</td><td>${money(t.amount)}</td><td>${t.mode}</td><td>${esc(t.reference || '')}</td></tr>`).join('')
    || '<tr><td colspan="6" class="text-muted">No transactions in this range.</td></tr>';
}
$('#f').addEventListener('submit', act(async (e) => { e.preventDefault(); load(); }));
load();
})().catch((e) => { if (e.message !== 'login') console.error(e); });
</script>
</body></html>
